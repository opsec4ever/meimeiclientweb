<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Mei Mei World</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="crosshair"><span></span><span></span></div>
  <div id="mobile"><div id="stick"><div id="stick-knob"></div></div><div id="mobile-buttons"><button data-key="Space">JUMP</button><button data-key="ShiftLeft">RUN</button></div></div>
  <div id="key-hud"><div class="key-row"><span data-key="KeyW">W</span></div><div class="key-row"><span data-key="KeyA">A</span><span data-key="KeyS">S</span><span data-key="KeyD">D</span></div><div class="space-key" data-key="Space">SPACE</div></div>
  <div id="cps">CPS 0</div>
  <div id="region-map"><div class="map-title">REGION</div><canvas id="region-map-canvas" width="128" height="128"></canvas></div>
  <div id="inventory"><div class="inventory-window"><div class="inv-title">Crafting</div><div class="inv-grid crafting-grid"><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div></div><div class="inv-grid armor-grid"><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div></div><div class="inv-grid main-grid"><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div></div><div class="inv-grid hot-grid"><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div></div><div class="inv-close">E to close</div></div></div>
  <div id="survival-hud">
    <div class="hud-top"><div class="hearts"><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span></div><div class="food"><span class="food-icon"></span><span class="food-icon"></span><span class="food-icon"></span><span class="food-icon"></span><span class="food-icon"></span><span class="food-icon"></span><span class="food-icon"></span><span class="food-icon"></span><span class="food-icon"></span><span class="food-icon"></span></div></div>
    <div class="xp-wrap"><div class="xp-fill"></div><span class="xp-level">0</span></div>
    <div class="hotbar"><div class="hotbar-slots"><div class="hotbar-slot selected"><span class="slot-number">1</span></div><div class="hotbar-slot"><span class="slot-number">2</span></div><div class="hotbar-slot"><span class="slot-number">3</span></div><div class="hotbar-slot"><span class="slot-number">4</span></div><div class="hotbar-slot"><span class="slot-number">5</span></div><div class="hotbar-slot"><span class="slot-number">6</span></div><div class="hotbar-slot"><span class="slot-number">7</span></div><div class="hotbar-slot"><span class="slot-number">8</span></div><div class="hotbar-slot"><span class="slot-number">9</span></div></div><div class="hotbar-slot"></div><div class="hotbar-slot"></div><div class="hotbar-slot"></div><div class="hotbar-slot"></div><div class="hotbar-slot"></div><div class="hotbar-slot"></div><div class="hotbar-slot"></div><div class="hotbar-slot"></div></div><div class="hotbar-selection"></div></div>
  </div>
  <div id="hud">
    <div id="fps">FPS 0</div>
  </div>
  <div id="loading">
    <div class="loading-title">MEI MEI CLIENT</div>
    <div class="loading-text">GENERATING WORLD...</div>
    <div class="bar"><div id="progress"></div></div>
  </div>
  <div id="start">
    <div class="start-box">
      <div class="start-title">MEI MEI</div>
      <div class="start-sub">DONUTSMP SIMULATION</div>
      <button id="play">PLAY WORLD</button>
      <div class="controls">WASD · MOVE<br>SPACE · JUMP<br>SHIFT · SPRINT<br>ESC · RELEASE MOUSE<br><span class="mobile-help">MOBILE · JOYSTICK + LOOK</span></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
